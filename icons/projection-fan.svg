<svg
	class="absolute bottom-0 left-1/2 -translate-x-1/2 w-full h-full opacity-50 mix-blend-screen"
	viewBox="0 0 1000 400"
	preserveAspectRatio="none"
>
	<defs>
		<linearGradient
			id="focusedRay"
			x1="50%"
			y1="100%"
			x2="50%"
			y2="0%"
		>
			<stop
				offset="0%"
				stop-color="var(--color-primary)"
				stop-opacity="0.7"></stop>
			<stop
				offset="60%"
				stop-color="var(--color-primary)"
				stop-opacity="0.2"></stop>
			<stop
				offset="100%"
				stop-color="var(--color-primary)"
				stop-opacity="0"></stop>
		</linearGradient>
	</defs>
	<path
		d="M500,400 L0,0 L1000,0 Z"
		fill="url(#focusedRay)"
		class="animate-pulse"></path>
	<line
		x1="500"
		y1="400"
		x2="0"
		y2="0"
		stroke="var(--color-primary)"
		stroke-width="1.5"
		opacity="0.5"></line>
	<line
		x1="500"
		y1="400"
		x2="1000"
		y2="0"
		stroke="var(--color-primary)"
		stroke-width="1.5"
		opacity="0.5"></line>
</svg>
